name: Sponsor Audit Tests
on:
  pull_request:
  push:
    branches:
      - assignment/sponsor-selection-audit-2026
jobs:
  sponsor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute sponsor tests
        run: npx --yes tsx --test src/lib/*.test.ts
